# Adapted from spike-html-hosting-components (ac754f1): mise.toml, its toolchain, lint, type check,
# build, and unit tier.
# Adapted from spike-html-hosting-components (aa9d491): mise.toml, its browser tier, its
# screenshots, and chrome-headless-shell, on the browse page.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The icons layer's toolchain.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.18.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser, at spike-html-hosting-sdk's pin. Chrome for Testing publishes no
# checksums: take the sha256 and size from the download by hand at each bump.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.38"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:deafffa74660b34853a4119c361fd427ac8c9fcb62db51ddb8a797cd83a4ba2d", size = "128168542" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the repository's Node-side JavaScript and TypeScript, and the browse page's module, with tsc, never emitting"
depends = ["preflight"]
run = ["tsc -p .", "tsc -p browse"]

# The generator runs as TypeScript under Node's type stripping, on the installed @iconify-json sets.
[tasks.build]
description = "Generate the released icon sets, sets.json's, into a fresh dist/"
depends = ["preflight"]
run = "node scripts/build.ts"

[tasks."test:unit"]
description = "Run the unit tier on the generator, its fixture sets, a pack of the build, and a fixture build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

# The browse page imports the built modules, so the tier runs on dist/.
[tasks."test:browser"]
description = "Run the browser tier on the browse page, over dist/, in the pinned chrome-headless-shell, and the screenshots command once, its captures under a scratch TMPDIR"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

# The browse page, served as the browser tier serves it, until interrupted: a reader's look at
# every released glyph, never part of the package.
[tasks.browse]
description = "Serve the browse page over dist/ on a free loopback port and print its URL; stop with Ctrl-C"
depends = ["preflight", "build"]
run = "node scripts/browse.ts"

# Never a dependency of check: a reviewer's look at the browse page, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.ts; its files
# go to a fresh directory under TMPDIR unless --dir names one, and captures/ is gitignored for that.
# The browser tier runs it once (test/browser/screenshots.test.ts).
[tasks.screenshots]
description = "Capture the browse page whole, wide and narrow, and with its theme menu open, light and dark, at the defaults, or --palette/--space/--type <name>, or --all; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec spike-html-apps-screenshots scripts/screenshots.config.ts"

[tasks.install]
description = "Install the pins and node_modules, the foundation and the tooling at their tags; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, and the foundation's and the tooling's tags behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
