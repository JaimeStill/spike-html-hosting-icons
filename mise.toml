# Adapted from spike-html-hosting-components (ac754f1): mise.toml, its toolchain, lint, type check,
# build, and unit tier, without the browser tier, the screenshots, and chrome-headless-shell, which
# the layer gains with its browse page.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The icons layer's toolchain.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.18.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the repository's JavaScript and TypeScript with tsc, never emitting"
depends = ["preflight"]
run = "tsc -p ."

# The generator runs as TypeScript under Node's type stripping, on the installed @iconify-json sets.
[tasks.build]
description = "Generate the released icon sets, sets.json's, into a fresh dist/"
depends = ["preflight"]
run = "node scripts/build.ts"

[tasks."test:unit"]
description = "Run the unit tier on the generator, its fixture sets, a pack of the build, and a fixture build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit"]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.currency]
description = "Report every mise tool, package.json pin, and action pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
